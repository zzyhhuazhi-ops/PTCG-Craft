tasks.register('writeClientLaunch') {
    dependsOn 'configureClientLaunch', 'classes'
    doLast {
        def run = tasks.named('runClient').get()
        def executable = javaToolchains.launcherFor(java.toolchain).get().executablePath.asFile.absolutePath
        file('build/client-launch.txt').text = ([executable] + run.allJvmArgs + ['-cp', run.classpath.asPath, run.mainClass.get()] + run.args).join('\n')
    }
}

processResources {
    exclude 'metadata/**'
    // Item model lookup uses the registered item namespace (ptcglive), while
    // imported card art deliberately remains under ptcglive_mc.  Copy only
    // the tiny JSON model layer; all models retain their explicit references
    // to the shared ptcglive_mc base model and PNG thumbnail texture.
    from('src/generated/resources/assets/ptcglive_mc/models/item') {
        include '**/*.json'
        into 'assets/ptcglive/models/item'
    }
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}


base { archivesName = 'ptcg-craft' }
loom {
    runs {
        client {
            vmArg '-Xmx4G'
            programArgs '--username', 'PTCGTester', '--width', '1100', '--height', '760'
        }
    }
}
repositories {
    mavenCentral()
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}
dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings 'net.fabricmc:yarn:1.21.1+build.3:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.16.10'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.115.6+1.21.1'
    // Optional, compile-only integration. The exact locally installed Cobblemon
    // build is used when present and is never bundled into PTCG Craft.
    def cobblemonJar = file('local-deps/Cobblemon-fabric-1.8.0+1.21.1.jar')
    if (cobblemonJar.isFile()) {
        modCompileOnly files(cobblemonJar)
        compileOnly fileTree('local-deps') { include 'kotlin-stdlib*.jar' }
    } else {
        modCompileOnly('maven.modrinth:MdwFAVRL:YgmyyFcs') { transitive = false }
        compileOnly 'org.jetbrains.kotlin:kotlin-stdlib:2.2.20'
    }
}
java { toolchain { languageVersion = JavaLanguageVersion.of(21) }; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 21 }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

sourceSets {
    main.output.dir('src/generated/resources')
    test.java.srcDir 'tests'
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}
loom {
    mods {
        ptcglive { sourceSet sourceSets.main }
        ptcglive_gametest { sourceSet sourceSets.gametest }
    }
    runs {
        gametest {
            server()
            name 'PTCG Craft headless integration tests'
            source sourceSets.gametest
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get().asFile}/gametest-results.xml"
            runDir 'build/gametest-run'
        }
    }
}
tasks.withType(AbstractArchiveTask).configureEach { zip64 = true }
// Only full-size faces are external. Compact item sprites and thumbnails must
// remain available without a resource pack. Restore JPGs after Loom remapping.
tasks.withType(Jar).configureEach {
    exclude 'metadata/**', '**/card_art/**', '**/card_thumb/**'
}
tasks.named('sourcesJar') { exclude 'assets/**', 'metadata/**' }
def cardThumbStagingRoot = layout.buildDirectory.dir('card-thumb-staging')
def registeredCardThumbnailFiles = file('src/generated/resources/ptcg-cards.tsv').readLines('UTF-8')
    .collect { line -> line.split('\t', -1)[0] + '.jpg' }
tasks.register('stageCardThumbnails', Sync) {
    duplicatesStrategy = DuplicatesStrategy.FAIL
    from('src/generated/resources/assets/ptcglive_mc/card_thumb') { include registeredCardThumbnailFiles }
    from('src/main/resources/assets/ptcglive_mc/card_thumb') { include '**/*.jpg' }
    into(cardThumbStagingRoot.map { it.dir('assets/ptcglive_mc/card_thumb') })
}
tasks.register('restoreCardThumbnails', Exec) {
    dependsOn tasks.named('remapJar'), tasks.named('stageCardThumbnails')
    def remapped = tasks.named('remapJar').flatMap { it.archiveFile }
    inputs.dir(cardThumbStagingRoot)
    outputs.file(remapped)
    outputs.upToDateWhen { false }
    doFirst {
        def jarTool = new File(System.getProperty('java.home'), 'bin/jar.exe')
        if (!jarTool.isFile()) jarTool = new File(System.getProperty('java.home'), 'bin/jar')
        commandLine jarTool.absolutePath, '--update', '--file', remapped.get().asFile.absolutePath,
            '-C', cardThumbStagingRoot.get().asFile.absolutePath, 'assets/ptcglive_mc/card_thumb'
    }
}
tasks.named('assemble') { dependsOn 'verifyCoreJarArtwork' }
// Direct remapJar releases must also restore and verify the mandatory thumbnails.
tasks.named('remapJar') { finalizedBy 'verifyCoreJarArtwork' }
tasks.register('verifyCoreJarArtwork') {
    dependsOn tasks.named('restoreCardThumbnails')
    def remapped = tasks.named('remapJar').flatMap { it.archiveFile }
    doLast {
        new java.util.zip.ZipFile(remapped.get().asFile).withCloseable { zip ->
            def seen = new HashSet<String>()
            zip.entries().each { entry ->
                def name = entry.name
                if (!seen.add(name)) throw new GradleException("Duplicate archive entry: ${name}")
                if (!entry.directory && name.contains('/card_art/'))
                    throw new GradleException("Full-size card artwork must be external: ${name}")
                if (name.endsWith('/merchant_token.json') || name.endsWith('/MerchantTokenItem.class') || name.endsWith('/PackMerchantItems.class'))
                    throw new GradleException("Retired merchant resource: ${name}")
            }
            def aliasEntry = zip.getEntry('assets/ptcglive_mc/card_art_aliases.json')
            if (aliasEntry == null) throw new GradleException('Missing stable artwork aliases')
            def aliases = zip.getInputStream(aliasEntry).withCloseable { stream -> new groovy.json.JsonSlurper().parse(stream, 'UTF-8').aliases }
            if (aliases.size() != 438) throw new GradleException('SD100 aliases must retain all 438 identities')
            aliases.each { cardId, sourceId ->
                ['ptcglive', 'ptcglive_mc'].each { ns ->
                    def model = zip.getEntry("assets/${ns}/models/item/${cardId}.json")
                    if (model == null) throw new GradleException("Missing model ${cardId}")
                    def layer = zip.getInputStream(model).withCloseable { stream -> new groovy.json.JsonSlurper().parse(stream, 'UTF-8').textures.layer0 }
                    if (layer != "ptcglive_mc:item/cards/${sourceId}") throw new GradleException("Broken alias ${cardId}")
                }
            }
            def cardIds = new HashSet<String>()
            ['ptcg-cards.tsv', 'ptcg-starter-deck-100.tsv', 'ptcg-energy-printings.tsv', 'ptcg-cn-supporters.tsv', 'ptcg-sc-exclusive.tsv', 'ptcg-mega-completion.tsv'].each { catalog ->
                zip.getInputStream(zip.getEntry(catalog)).withCloseable { stream ->
                    stream.getText('UTF-8').readLines().findAll { !it.isBlank() }.each { cardIds.add(it.split('\t', -1)[0]) }
                }
            }
            def markEntry = zip.getEntry('data/ptcglive/printed-regulation-marks.tsv')
            if (markEntry == null) throw new GradleException('Missing printed regulation-mark index')
            def markIds = new HashSet<String>()
            zip.getInputStream(markEntry).withCloseable { stream ->
                stream.getText('UTF-8').readLines().each { line ->
                    def fields = line.split('\t', -1)
                    if (fields.length != 2 || !(fields[1] ==~ /[A-J]?/) || !markIds.add(fields[0]))
                        throw new GradleException('Invalid or duplicate printed regulation-mark row')
                }
            }
            if (markIds != cardIds) throw new GradleException('Regulation-mark index must classify every catalog ID exactly once')
            def factsEntry = zip.getEntry('data/ptcglive/collection-card-facts.json')
            if (factsEntry == null) throw new GradleException('Missing collection search index')
            def facts = zip.getInputStream(factsEntry).withCloseable { stream -> new groovy.json.JsonSlurper().parse(stream, 'UTF-8') }
            if (facts.keySet() != cardIds) throw new GradleException('Collection search index must cover every catalog ID')
            cardIds.each { cardId ->
                def sourceId = aliases[cardId] ?: cardId
                ["card_thumb/${sourceId}.jpg", "textures/item/cards/${sourceId}.png"].each { path ->
                    def entry = zip.getEntry("assets/ptcglive_mc/${path}")
                    if (entry == null || entry.size == 0) throw new GradleException("Missing builtin card image: ${cardId} -> ${path}")
                }
                ['ptcglive', 'ptcglive_mc'].each { ns ->
                    def model = zip.getEntry("assets/${ns}/models/item/${cardId}.json")
                    if (model == null) throw new GradleException("Missing card model: ${cardId}")
                    def layer = zip.getInputStream(model).withCloseable { stream -> new groovy.json.JsonSlurper().parse(stream, 'UTF-8').textures.layer0 }
                    def parts = layer.split(':', 2)
                    if (zip.getEntry("assets/${parts[0]}/textures/${parts[1]}.png") == null)
                        throw new GradleException("Missing item model texture: ${cardId} -> ${layer}")
                }
            }
            logger.lifecycle("Verified: ${cardIds.size()} card IDs have builtin thumbnails and item sprites; full-size art remains external")
        }
    }
}

